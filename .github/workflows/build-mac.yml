name: Build macOS DMG

# 在 GitHub 托管的 macOS runner 上构建 dmg（Windows 本机无法产出 dmg）
#
# 方式一：Actions 页面手动触发（Run workflow），可选 arm64 / x64 / all
# 方式二：推送 tag，例如 git tag v1.1.2-mac && git push --tags
#
# 不配置任何 secrets 也能跑：产出的是 ad-hoc 签名的包。
# 配置了 secrets 则为正式签名 + 公证（见 README「macOS 打包」一节）。
#
# 注意：公证要求 hardened runtime。当前 package.json 里
# build.mac.hardenedRuntime 默认 false（ad-hoc 签名开着它 App 起不来），
# 配置好 MAC_CERTS 做正式签名时，记得把它改回 true。

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 目标架构
        type: choice
        options: [all, arm64, x64]
        default: all
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    # Intel runner（macos-13）已陆续下线，统一用 Apple Silicon runner：
    # arm64 原生构建，x64 借助 Rosetta 2 交叉构建。
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖（koffi 原生模块需在此编译）
        run: npm install

      - name: 生产构建
        run: npm run build

      - name: 检查内置 Signal 资源
        run: |
          if [ -f resources/mac/signal-app.asar ]; then
            echo "✅ 本次包含 macOS 版内置 Signal"
            du -sh resources/mac/signal-app.asar
          else
            echo "ℹ️  resources/mac/signal-app.asar 不存在：本次产物不内置 Signal，"
            echo "   运行时会回退到用户已安装的 /Applications/Signal.app。"
            echo "   需要内置请本地执行 bash scripts/extract-signal-mac.sh 并把产物提交进仓库。"
          fi

      - name: 导入签名证书（可选）
        env:
          # 在仓库 Settings → Secrets 里配置后才生效：
          #   MAC_CERTS          base64(DeveloperID Application 证书 p12)
          #   MAC_CERTS_PASSWORD p12 密码
          #   KEYCHAIN_PASSWORD  临时钥匙串密码（任意字符串）
          #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID  公证用
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          CSC_KEYCHAIN: ${{ runner.temp }}/build.keychain
          CSC_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "${CSC_LINK:-}" ]; then
            echo "未配置签名证书，走 ad-hoc 签名"
            echo "signed=false" >> "$GITHUB_ENV"
            exit 0
          fi
          security create-keychain -p "$CSC_KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN"
          security default-keychain -s "$CSC_KEYCHAIN"
          security unlock-keychain -p "$CSC_KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN"
          echo "$CSC_LINK" | base64 --decode -o /tmp/certs.p12
          security import /tmp/certs.p12 -k "$CSC_KEYCHAIN" \
            -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$CSC_KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$CSC_KEYCHAIN"
          rm -f /tmp/certs.p12
          echo "signed=true" >> "$GITHUB_ENV"

      - name: 打包 arm64 (Apple Silicon)
        if: github.event.inputs.arch != 'x64'
        env:
          # electron-builder 下载 Electron 时会调 GitHub API。
          # 未认证额度为 60 次/小时，CI 上很容易撞上限导致下载失败，
          # 带上内置 token 可避免这种偶发失败。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --arm64 dmg zip

      - name: 准备 Rosetta（x64 交叉构建用）
        if: github.event.inputs.arch != 'arm64'
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: 打包 x64 (Intel)
        if: github.event.inputs.arch != 'arm64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --x64 dmg zip

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: 附带到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
