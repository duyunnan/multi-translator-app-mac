<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>美国之音</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #edf0f6;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    .bar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px 0 12px;
      background: rgba(255, 255, 255, 0.92);
      color: #3d4455;
      border-bottom: 1px solid rgba(18, 30, 58, 0.07);
      box-shadow: 0 1px 10px rgba(20, 35, 70, 0.06);
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #3d4455;
    }
    .actions { display: flex; align-items: center; gap: 8px; }
    .phone-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: #1a73e8;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .phone-btn:hover { background: #1a5fd0; }
    .phone-btn:disabled { opacity: 0.35; cursor: default; }
    .phone-btn svg { display: block; }
    .fill {
      height: calc(100% - 48px);
      overflow: auto;
      position: relative;
      background: #f5f7f8;
    }
    .status, .error-box {
      margin: 28px 16px;
      padding: 16px;
      border-radius: 12px;
      background: #fff;
      color: #4a5568;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }
    .error-box { color: #b4453a; }
    .retry {
      margin-top: 12px;
      border: none;
      background: #1a73e8;
      color: #fff;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 13px;
    }
    .list { padding: 10px 10px 18px; }
    .card {
      display: block;
      width: 100%;
      text-align: left;
      border: none;
      background: #fff;
      border-radius: 12px;
      padding: 12px 13px;
      margin-bottom: 8px;
      cursor: pointer;
      box-shadow: 0 1px 6px rgba(20, 35, 70, 0.05);
    }
    .card:hover { background: #f8fbff; }
    .card h3 {
      font-size: 14px;
      font-weight: 650;
      color: #1f2937;
      line-height: 1.45;
      margin-bottom: 6px;
    }
    .card p { font-size: 12px; color: #64748b; line-height: 1.5; }
    .card .meta { margin-top: 6px; font-size: 11px; color: #94a3b8; }
    .overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(245, 247, 248, 0.92);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      z-index: 5;
      color: #475569;
      font-size: 13px;
    }
    .overlay.show { display: flex; }
    .spin {
      width: 22px; height: 22px;
      border: 2px solid #c5d4ea;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="bar">
    <div class="title">美国之音 · VOA</div>
    <div class="actions">
      <button type="button" class="phone-btn" id="btn-home" title="首页">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M4 11.5 L12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-8.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </button>
      <button type="button" class="phone-btn primary" id="btn-back" title="返回" disabled>
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
          <path d="M14.5 6.5 L9 12l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="fill" id="fill">
    <div class="overlay" id="overlay"><div class="spin"></div><div>正在加载新闻…</div></div>
    <div id="content"></div>
  </div>
  <script src="news-shell.js"></script>
</body>
</html>
